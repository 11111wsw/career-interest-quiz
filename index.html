        /* 结果页 */

<body>
    <div class="container">
        <!-- 首页 -->
        <div class="start-screen" id="startScreen">

            <ul class="feature-list">

        <!-- 答题页 -->

            <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" style="opacity: 0.5; pointer-events: none;">下一题 →</button>
        </div>
        
        <!-- 结果页 -->
        <div class="result-screen hidden" id="resultScreen">
            <div class="result-header">
                <h2>🎯 你的职业兴趣报告</h2>

            </div>
            
            <canvas class="radar-chart" id="radarChart" width="300" height="300"></canvas>
            
            <div class="section">
                <h3>🔍 你是谁？</h3>

            </div>
            
            <div class="section">

            <div class="section">

            </div>
            
            <div class="section">

            </div>
            
            <div class="section">
                <h3>💼 推荐职业方向</h3>
                <div id="jobCategories"></div>
            </div>
            
            <div class="section">
                <h3>📚 你的学习方式</h3>
                <p id="learningText"></p>
            </div>
            
            <div class="section">
                <h3>🤝 你的最佳搭档</h3>
                <p id="partnerText"></p>
            </div>
            
            <div class="section">
                <h3>🌟 给你的发展建议</h3>
                <div id="adviceList"></div>
            </div>
            
            <button class="btn-primary" onclick="restartQuiz()">重新测试</button>
            <p class="disclaimer">本测试基于霍兰德职业兴趣理论，仅供娱乐参考</p>
        </div>
    </div>
    
    <script>
        // 题目数据：每个选项显式绑定维度
        const questions = [
            // R 现实型
            {
                text: "周末你更想做什么？",

                    { text: "喜剧片、家庭片", dim: "S" }
                ]
            },
            {

                options: [
                    { text: "拆解问题、找到规律", dim: "I" },
                    { text: "动手制作、修理东西", dim: "R" },
                    { text: "创意写作、表达想法", dim: "A" },
                    { text: "协调关系、帮助别人", dim: "S" }
                ]
            },
            
            // A 艺术型
            {
                text: "你觉得自己更像？",
                options: [
                    { text: "务实的人", dim: "R" },
                    { text: "理性的人", dim: "I" },
                    { text: "感性的人", dim: "A" },
                    { text: "热情的人", dim: "E" }
                ]
            },
            {
                text: "布置房间你会？",
                options: [
                    { text: "实用为主，怎么方便怎么来", dim: "R" },
                    { text: "整洁有序，东西分类放好", dim: "C" },
                    { text: "要有自己的风格和品味", dim: "A" },
                    { text: "温馨舒适，朋友来了都喜欢", dim: "S" }
                ]
            },
            {
                text: "你最不喜欢？",
                options: [
                    { text: "一成不变的重复", dim: "A" },
                    { text: "没有逻辑的混乱", dim: "I" },
                    { text: "死板的规则限制", dim: "E" },
                    { text: "一个人独处", dim: "S" }
                ]
            },
            {
                text: "你更喜欢哪种表达？",
                options: [
                    { text: "用实物、用行动", dim: "R" },
                    { text: "用数据、用逻辑", dim: "I" },
                    { text: "用文字、用画面", dim: "A" },
                    { text: "用语言、用沟通", dim: "S" }
                ]
            },
            
            // S 社会型
            {
                text: "朋友遇到烦心事，你会？",
                options: [
                    { text: "帮他想办法解决", dim: "E" },
                    { text: "陪他分析原因", dim: "I" },
                    { text: "听他倾诉、安慰他", dim: "S" },
                    { text: "带他出去玩散心", dim: "A" }
                ]
            },
            {
                text: "在团队里你通常是？",
                options: [
                    { text: "干活最多的那个", dim: "R" },
                    { text: "出主意想办法的那个", dim: "I" },
                    { text: "调节气氛的那个", dim: "A" },
                    { text: "协调大家关系的那个", dim: "S" }
                ]
            },
            {
                text: "你觉得工作最重要的是？",
                options: [
                    { text: "能学到技能", dim: "I" },
                    { text: "能有成就感", dim: "E" },
                    { text: "能自由发挥", dim: "A" },
                    { text: "能帮助别人", dim: "S" }
                ]
            },
            {
                text: "你更喜欢和什么样的人合作？",
                options: [
                    { text: "踏实肯干的人", dim: "R" },
                    { text: "聪明有想法的人", dim: "I" },
                    { text: "友善好说话的人", dim: "S" },
                    { text: "有领导力的人", dim: "E" }
                ]
            },
            
            // E 企业型
            {
                text: "如果组织活动，你通常是？",
                options: [
                    { text: "负责具体执行", dim: "R" },
                    { text: "负责策划方案", dim: "I" },
                    { text: "负责现场布置", dim: "A" },
                    { text: "负责统筹安排", dim: "E" }
                ]
            },
            {
                text: "你更欣赏哪种人？",
                options: [
                    { text: "技术过硬的人", dim: "R" },
                    { text: "聪明有想法的人", dim: "I" },
                    { text: "有才华的人", dim: "A" },
                    { text: "有领导力的人", dim: "E" }
                ]
            },
            {
                text: "你觉得自己更擅长？",
                options: [
                    { text: "做具体的事情", dim: "R" },
                    { text: "分析和思考", dim: "I" },
                    { text: "创意和表达", dim: "A" },
                    { text: "说服和影响别人", dim: "E" }
                ]
            },
            {
                text: "你更想做什么样的工作？",
                options: [
                    { text: "自己说了算、有决策权", dim: "E" },
                    { text: "按规则来、稳定可靠", dim: "C" },
                    { text: "自由创作、不受约束", dim: "A" },
                    { text: "帮助别人、很有意义", dim: "S" }
                ]
            },
            
            // C 常规型
            {
                text: "你的书桌通常是？",
                options: [
                    { text: "有点乱，但我知道东西在哪", dim: "R" },
                    { text: "整齐，分类清楚", dim: "C" },
                    { text: "有自己的风格", dim: "A" },
                    { text: "经常有朋友来玩", dim: "S" }
                ]
            },
            {
                text: "做事情你更喜欢？",
                options: [
                    { text: "边做边调整", dim: "A" },
                    { text: "先做计划再执行", dim: "C" },
                    { text: "凭感觉来", dim: "R" },
                    { text: "和大家一起商量着来", dim: "S" }
                ]
            },
            {
                text: "你觉得自己最大的优点是？",
                options: [
                    { text: "动手能力强", dim: "R" },
                    { text: "细心、有条理", dim: "C" },
                    { text: "有创意", dim: "A" },
                    { text: "善于沟通", dim: "S" }
                ]
            },
            {
                text: "你更喜欢哪种任务？",
                options: [
                    { text: "有明确标准、按流程走", dim: "C" },
                    { text: "有挑战性、需要创新", dim: "A" },
                    { text: "能帮到别人、有意义", dim: "S" },
                    { text: "有权力、能决策", dim: "E" }
                ]
            }
        ];
        
        // 维度说明（霍兰德标准译名）
        const dimensions = [
            { key: 'R', name: '现实型', color: '#FF6B6B' },
            { key: 'I', name: '研究型', color: '#4ECDC4' },
            { key: 'A', name: '艺术型', color: '#45B7D1' },
            { key: 'S', name: '社会型', color: '#96CEB4' },
            { key: 'E', name: '企业型', color: '#FFEAA7' },
            { key: 'C', name: '常规型', color: '#DDA0DD' }
        ];
        
        let currentQuestion = 0;
        let scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
        let selectedOption = -1;
        
        function startQuiz() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            currentQuestion = 0;
            scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
            showQuestion();
        }
        
        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `第 ${currentQuestion + 1} 题 / 共 ${questions.length} 题`;
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            selectedOption = -1;
            
            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option.text;
                div.onclick = () => selectOption(index, div);
                container.appendChild(div);
            });
            
            document.getElementById('nextBtn').style.opacity = '0.5';
            document.getElementById('nextBtn').style.pointerEvents = 'none';
        }
        
        function selectOption(index, element) {
            selectedOption = index;
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('nextBtn').style.opacity = '1';
            document.getElementById('nextBtn').style.pointerEvents = 'auto';
        }
        
        function nextQuestion() {
            if (selectedOption === -1) return;
            
            // 计分：选什么就加什么分，杜绝0分选项
            const q = questions[currentQuestion];
            const opt = q.options[selectedOption];
            scores[opt.dim] += 1;
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        
        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            // 霍兰德三字母代码（前三高分维度）
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sorted[0][0];
            const topDimension = dimensions.find(d => d.key === topType);
            
            // 生成三字母代码
            const code = sorted.slice(0, 3).map(([k]) => k).join('');
            const tied = sorted[0][1] === sorted[1][1];
            
            let codeText = `${topDimension.name}型 · ${code}`;
            if (tied) codeText += '（兴趣较均衡）';
            
            document.getElementById('resultType').textContent = codeText;
            
            // 雷达图
            drawRadarChart();
            
            // 根据类型显示结果
            const results = {
                R: {
                    who: '你是一个务实的行动派。相信"做出来才算数"，不喜欢空谈。你动手能力强，喜欢具体的、看得见摸得着的事情，是团队里最靠谱的实干家。',
                    strengths: [
                        '动手能力极强，能快速学会各种实操技能',
                        '做事踏实靠谱，交给你的事一定能完成',

        function drawRadarChart() {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const centerX = 150;
            const centerY = 150;
            const radius = 100;
            
            // 清空
            ctx.clearRect(0, 0, 300, 300);
            
            // 画网格
            for (let i = 1; i <= 3; i++) {
                ctx.beginPath();
                for (let j = 0; j < 6; j++) {
                    const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                    const r = radius * i / 3;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#eee';
                ctx.stroke();
            }
            
            // 画轴线
            for (let j = 0; j < 6; j++) {
                const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#eee';
                ctx.stroke();
            }
            
            // 画数据
            ctx.beginPath();
            const maxScore = Math.max(...Object.values(scores));
            for (let j = 0; j < 6; j++) {
                const dim = dimensions[j];
                const score = scores[dim.key];
                const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                const r = (score / maxScore) * radius;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 画标签
            ctx.fillStyle = '#666';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let j = 0; j < 6; j++) {
                const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                const x = centerX + (radius + 20) * Math.cos(angle);
                const y = centerY + (radius + 20) * Math.sin(angle);
                ctx.fillText(dimensions[j].name, x, y);
            }
        }
